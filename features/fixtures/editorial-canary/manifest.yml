schemaVersion: 1
profile: canary-profile.yml
calibration:
  judgePromptVersion: "3"
  judgeModel: gpt-5.6-terra
entries:
  - id: house-voice
    kind: scan
    draft: ../editorial-diagnosis/house-voice-density-excerpt.md
    alwaysLane:
      forbidKinds:
        - low_lexical_density
        - high_compressibility
  - id: fluff
    kind: scan
    draft: fluff-long.md
    alwaysLane:
      expectKinds:
        - low_lexical_density
  - id: over-polished-ai
    kind: scan
    draft: ../editorial-diagnosis/must-fail/brochure-hedges.md
    alwaysLane:
      expectKinds:
        - vague_claim
  - id: short-draft
    kind: scan
    draft: ../editorial-always-lane/fluffy-short-below-minwords.md
    alwaysLane:
      forbidKinds:
        - low_lexical_density
        - high_compressibility
  - id: factual-drift
    kind: compareRegression
    baseline: ../editorial-compare/original.md
    working: ../editorial-compare/working-unsupported.md
    compare:
      expectHardConstraints:
        - unsupported_claims_increase
fixtureJudge:
  house-voice: []
  fluff:
    - kind: vague_claim
      start: 0
      end: 40
      rationale: "Fixture judge: opening hedge stack reads like brochure padding."
  over-polished-ai:
    - kind: voice_mismatch
      start: 0
      end: 30
      rationale: "Fixture judge: marketing brochure tone versus peer engineering voice."
  short-draft: []
  factual-drift:
    baseline: []
    working:
      - kind: unsupported_certainty
        start: 0
        end: 55
        rationale: "Fixture judge: absolute speed claim lacks attribution."
