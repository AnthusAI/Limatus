  - id: sample-five
    title: Sample Five
    url: https://anth.us/blog/sample-five/
    path: ../editorial-diagnosis/reference-samples/sample-five.md
headline:
  when: afterBody
  order:
    - title
    - subtitle
  title:
    key: title
  subtitle:
    key: standfirst
    role: articleSummary
