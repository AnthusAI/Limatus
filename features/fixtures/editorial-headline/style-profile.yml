schemaVersion: 1
publicationKey: limatus-headline-fixture
editorialAim: Clear engineering headlines that match the revised body.
voice:
  name: Limatus headline fixture voice
audience: Practicing AI and ML engineers evaluating tools, cost, and risk.
tone:
  - Conversational but precise.
sentenceStyle:
  - Use contractions and active voice.
structure:
  - Lead with the practical stake for the reader.
lexicon:
  prefer:
    - inspect
    - verify
    - latency
  avoid:
    - revolutionize
    - game-changing
    - leverage synergies
evidenceRules:
  - Prefer primary sources and attributable citations.
referenceSamples:
  - id: sample-one
    title: Sample One
    url: https://anth.us/blog/sample-one/
    path: ../editorial-diagnosis/reference-samples/sample-one.md
  - id: sample-two
