schemaVersion: 1
publicationKey: fixture-surface-rules-formal
voice:
  name: Fixture formal register
audience: Engineers evaluating tools, cost, and risk.
tone:
  - Cool, impersonal register that deliberately avoids contracting in narration.
sentenceStyle:
  - Formal, uncontracted narration; contractions only inside quoted speech.
structure:
  - Lead with the practical stake for the reader.
lexicon:
  prefer:
    - inspect
    - verify
  avoid:
    - revolutionize
evidenceRules:
  - Do not invent anecdotes, statistics, or citations.
