schemaVersion: 1
publicationKey: fixture-surface-rules
voice:
  name: Fixture editorial
audience: Engineers evaluating tools, cost, and risk.
tone:
  - Conversational but precise.
sentenceStyle:
  - Use contractions and active voice.
structure:
  - Lead with the practical stake for the reader.
lexicon:
  prefer:
    - inspect
    - verify
  avoid:
    - revolutionize
evidenceRules:
  - Do not invent anecdotes, statistics, or citations.
referenceSamples:
  - id: sample-one
    title: Sample One
    url: https://example.com/sample-one/
    path: reference-samples/sample-one.md
  - id: sample-two
    title: Sample Two
    url: https://example.com/sample-two/
    path: reference-samples/sample-two.md
  - id: sample-three
    title: Sample Three
    url: https://example.com/sample-three/
    path: reference-samples/sample-three.md
  - id: sample-four
    title: Sample Four
    url: https://example.com/sample-four/
    path: reference-samples/sample-four.md
  - id: sample-five
    title: Sample Five
    url: https://example.com/sample-five/
    path: reference-samples/sample-five.md
rules:
  noEmojis: true
  contrastCap: 1
  bySurface:
    marketing:
      contrastCap: 2
    legal:
      contrastCap: null
standfirst:
  maxSentences: 2
  minWords: 5
  maxWords: 20
  maxSentenceWords: 15
  allowedProperNouns:
    - Chatticus
  insiderTerms:
    - API
    - latency
  insiderPatterns:
    - pattern: "\\b(a|an|the|another)\\s+Chatticus\\b"
      message: uses the product name as a category noun
  maxDescriptionOverlap: 0.7
