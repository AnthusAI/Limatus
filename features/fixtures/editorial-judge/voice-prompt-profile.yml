schemaVersion: 1
publicationKey: fixture-judge-voice-prompt
voice:
  name: Fixture judge voice
audience: Engineers validating judge prompt assembly.
tone:
  - Conversational but precise.
sentenceStyle:
  - JUDGE_FIXTURE_SENTENCE_STYLE_MARKER
structure:
  - JUDGE_FIXTURE_STRUCTURE_MARKER
voicePatterns:
  - JUDGE_FIXTURE_VOICE_PATTERNS_MARKER
lexicon:
  prefer:
    - inspect
    - verify
  avoid:
    - revolutionize
evidenceRules:
  - Label speculation explicitly.
checks:
  emptyLeadin: false
  listShapedProse: false
  vagueClaim: false
  unsupportedCertainty: false
  uniformCadence: false
  redundancy: false
  voiceMismatch: false
  missingAttribution: false
  informationDensity: false
  overusedWords: false
  uncontractedForms: false
rules:
  bannedIntensifiers:
    - seamless
judge:
  provider: openai
